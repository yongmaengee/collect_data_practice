[project]
name = "day1-pipeline"
version = "0.1.0"
description = "Day1 종합 실습 - 데이터 수집 미니 파이프라인"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"